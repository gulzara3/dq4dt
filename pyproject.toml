[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dq4dt"
version = "1.0.0"
description = "Data-Quality Elasticity: Benchmarking and Monitoring Digital-Twin Reliability Under Sensing Degradation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "[Gulzar Alam]" }]
keywords = ["digital twin", "data quality", "prognostics", "remaining useful life", "reliability", "benchmark"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "torch>=2.1", "numpy>=1.24", "pandas>=2.0", "scipy>=1.11",
    "scikit-learn>=1.4", "matplotlib>=3.8", "seaborn>=0.13", "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["dq4dt*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
